# Cloudflare Pages project for the IJIJ shop.
# Static pages live in public/, server code in functions/.
name = "ijij-shop"
compatibility_date = "2026-11-01"
pages_build_output_dir = "public"

[vars]
# Public URL of the shop, no trailing slash. Local dev overrides it in .dev.vars.
SITE_URL = "https://ijij-shop.pages.dev"
EMAIL_FROM = "Justin from itsjustinjapan <hello@example.com>"
# How long a download link works, and how many times.
DOWNLOAD_DAYS = "60"
DOWNLOAD_MAX = "15"
# R2 object key of the guide PDF.
GUIDE_KEY = "japan-the-complete-guide.pdf"
# Stripe prices (TEST mode). Swap for the live price IDs at launch.
STRIPE_PRICE_BUNDLE = "price_1UdEfFAg0KVyXnxV09UoRCXo"
STRIPE_PRICE_UPGRADE = "price_1UdEfIAg0KVyXnxVQjL62lxe"

[[d1_databases]]
binding = "DB"
database_name = "ijij-shop"
database_id = "d72ff882-c071-4cc1-b8e8-9ed09204de9e"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "FILES"
bucket_name = "ijij-shop-files"
