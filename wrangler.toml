# Cloudflare Worker for the IJIJ shop.
# Static pages live in public/, server routes in src/worker.ts (handlers in functions/).
name = "ijij-shop"
main = "src/worker.ts"
compatibility_date = "2026-11-01"

[observability]
enabled = true

[assets]
directory = "public"
binding = "ASSETS"
run_worker_first = true   # so the workers.dev → custom domain redirect runs for pages too

[vars]
# Public URL of the shop, no trailing slash. Local dev overrides it in .dev.vars.
SITE_URL = "https://shop.itsjustinjapan.com"
EMAIL_FROM = "Justin from itsjustinjapan <hello@itsjustinjapan.com>"
# Where customer replies go (Cloudflare Email Routing forwards hello@ to your inbox).
EMAIL_REPLY_TO = "hello@itsjustinjapan.com"
# How long a download link works, and how many times.
DOWNLOAD_DAYS = "60"
DOWNLOAD_MAX = "15"
# R2 object key of the guide PDF.
GUIDE_KEY = "japan-the-complete-guide.pdf"
# Stripe prices (TEST mode). Live IDs, for launch: bundle price_1Ue7BLAg0KVyXnxVwam5LddQ, upgrade price_1Ue7BNAg0KVyXnxVD6ZKYesn
STRIPE_PRICE_BUNDLE = "price_1UdEfFAg0KVyXnxV09UoRCXo"
STRIPE_PRICE_UPGRADE = "price_1UdEfIAg0KVyXnxVQjL62lxe"
# Cloudflare Turnstile (bot check on Purchase). The site key is public; the secret is the
# TURNSTILE_SECRET Worker secret. Tokens must come from one of these hostnames (never localhost here).
TURNSTILE_SITE_KEY = "0x4AAAAAAGK4-1hsupdepr_B"
TURNSTILE_HOSTNAMES = "shop.itsjustinjapan.com"

[[d1_databases]]
binding = "DB"
database_name = "ijij-shop"
database_id = "d72ff882-c071-4cc1-b8e8-9ed09204de9e"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "FILES"
bucket_name = "ijij-shop-files"

# Per-IP rate limits (Workers rate limiting binding). Period must be 10 or 60 seconds.
[[ratelimits]]
name = "CHECKOUT_LIMITER"   # payment attempts: stops card-testing bots
namespace_id = "1001"
simple = { limit = 6, period = 60 }

[[ratelimits]]
name = "TRACK_LIMITER"      # page-view tracking and price quotes
namespace_id = "1002"
simple = { limit = 60, period = 60 }
