<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:IS;src:url(instrument-serif.woff2)}
@font-face{font-family:IS;font-style:italic;src:url(instrument-serif-italic.woff2)}
@font-face{font-family:Outfit;src:url(outfit.woff2);font-weight:100 900}
*{box-sizing:border-box;margin:0}
body{width:2000px;height:1500px;overflow:hidden;position:relative;font-family:Outfit;color:#2b1a1e;background:#e9e2d8}
.bg{position:absolute;inset:0;background:url(wall.jpg) center/cover;filter:saturate(.75) brightness(1.04)}
.warm{position:absolute;inset:0;background:linear-gradient(180deg,rgba(246,238,226,.35),rgba(236,224,208,.15))}
.head{position:absolute;left:150px;top:200px;width:720px}
.kicker{font-size:22px;letter-spacing:.34em;text-transform:uppercase;color:#7d6a5e}
h1{font-family:IS;font-weight:400;font-size:132px;line-height:.95;margin-top:28px;color:#2b1a1e;letter-spacing:-.015em}
h1 em{color:#6b1234}
.line{width:70px;height:1.5px;background:#6b1234;margin:46px 0 34px}
ul{list-style:none;padding:0;font-size:27px;line-height:2.05;color:#4a3a36;font-weight:300}
.price{margin-top:44px;font-size:22px;letter-spacing:.28em;text-transform:uppercase;color:#6b1234}
.book{position:absolute;left:1040px;top:230px;width:700px;height:990px;transform:rotate(3deg);
 box-shadow:-40px 60px 90px rgba(70,45,25,.30),-8px 12px 22px rgba(70,45,25,.18);border-radius:3px;overflow:hidden}
.book img{width:100%;height:100%;object-fit:cover;display:block}
.under{position:absolute;left:960px;top:300px;width:660px;height:933px;transform:rotate(-4deg);background:#fff;
 box-shadow:-20px 40px 60px rgba(70,45,25,.22);border-radius:3px;overflow:hidden}
.under img{width:100%;height:100%;object-fit:cover;display:block}
.phone{position:absolute;left:840px;top:880px;width:340px;height:520px;background:#141414;border-radius:54px;padding:14px;
 box-shadow:-30px 50px 80px rgba(60,35,20,.35)}
.phone img{display:block;width:100%;height:100%;object-fit:cover;object-position:top;border-radius:42px}
</style></head><body>
<div class="bg"></div><div class="warm"></div>
<div class="head">
 <div class="kicker">itsjustinjapan · 2027 edition</div>
 <h1>The <em>complete</em><br>guide to Japan</h1>
 <div class="line"></div>
 <ul><li>102-page guide, written from my own trips</li><li>14-day planner included</li><li>Instant download · phone or print</li></ul>
</div>
<div class="under"><img src="p82-082.png"></div>
<div class="book"><img src="p1-001.png"></div>

</body></html>
